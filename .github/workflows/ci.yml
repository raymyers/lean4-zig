name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # Windows is currently unsupported (mimalloc allocator path and
        # leanshared.dll linking are unverified) - see plans/ for status.
        runs-on: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.runs-on }}
    steps:
      - uses: actions/checkout@v4

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup elan (Lean version pinned by lean-toolchain)
        run: |
          curl -O --location https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh
          chmod u+x elan-init.sh
          ./elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: FFI surface completeness gate
        run: zig build ffi-inventory

      - name: Binding tests against libleanshared
        run: zig build test --summary all

      - name: Reverse-FFI example (lean lib => zig app, output asserted)
        run: zig build rffi

      - name: FFI example (zig lib => lean app, output asserted)
        run: zig build zffi
